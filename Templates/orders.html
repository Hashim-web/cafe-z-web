<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Order History - Cafe-Z</title>
</head>
<body>
    <h1>📋 Order History</h1>

    {% if orders %}
        <table border="1" cellpadding="8">
            <tr>
                <th>ID</th>
                <th>Customer</th>
                <th>Items</th>
                <th>Total</th>
                <th>Date</th>
            </tr>
            {% for order in orders %}
                <tr>
                    <td>{{ order[0] }}</td>
                    <td>{{ order[1] }}</td>
                    <td>{{ order[2] }}</td>
                    <td>Rs {{ order[3] }}</td>
                    <td>{{ order[4] }}</td>
                </tr>
            {% endfor %}
        </table>
    {% else %}
        <p>No orders yet.</p>
    {% endif %}

    <br>
    <a href="/">← Back to Menu</a>
</body>
</html>
